name: hygiene

on:
  push:
    # test-server is an automatic mirror of the test server (scripts/test-server-sync);
    # its out/ and assets run ahead of src/, so CI there only produces noise.
    branches-ignore:
      - 'test-server'
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hygiene license regression
        run: node tests/hygiene-license.test.cjs

      - name: Offline four-pool delivery checks
        run: |
          node tests/hygiene-four-gacha-art.test.cjs
          python3 assets/asset-patch/artwork/gacha-four-offline/verify.py

      - name: Hygiene scan (no personal IP / home path / personal email / .env / large binary)
        run: bash scripts/check-hygiene.sh --all

      - name: gitleaks (secret scan over history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
