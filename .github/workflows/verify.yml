name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.19.0
          - 22.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:node
        env:
          WF_DATABASE_DIR: ${{ runner.temp }}\starpoint-node-test-db
      - run: npm audit --omit=dev --audit-level=high

  admin:
    name: Admin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run typecheck
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: npm audit --audit-level=high
        working-directory: admin

  wiki:
    name: Wiki frontend and community (Node 24)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      # Wiki uses Node's built-in SQLite; no game server packages or database.
      - name: Test Wiki frontend
        run: node --test (Get-ChildItem mod-tools/tests/test_wiki_*.cjs).FullName
      - name: Test Wiki community
        run: node --test (Get-ChildItem mod-tools/wiki-community/tests/*.test.mjs).FullName

  tools:
    name: Python tools and launcher
    runs-on: windows-latest
    env:
      # 工具链全程中文输出;runner 控制台是 cp1252,不设 UTF-8 会 UnicodeEncodeError。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      # 默认 TEMP 落在用户资料目录下且带 8.3 短名(RUNNER~1);tempfile 基于它
      # 建目录后,任何 Path.resolve() 都会展开成长路径,路径比较/relative_to
      # 全部失配。RUNNER_TEMP 没有短路径成分。
      - name: Point TEMP at the long-form runner temp dir
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mod-tools/requirements.txt
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r mod-tools/requirements.txt
      - run: python -m unittest discover -s mod-tools/tests -p "test_*.py"
      # 只用仓库里已提交的东西验回执:合同、9 个 ZIP、manifest、服务端数据。
      # 不碰 .cdn、不碰本地真值根——克隆下来的人跑的就是这一条。
      - name: Verify the committed local-live release receipt
        run: npm run verify:local-release
      - shell: powershell
        run: ./scripts/tests/test-start-cn.ps1

  release-transaction-posix:
    # 发布事务的清理路径按平台分流:Windows 走句柄 FileDispositionInfo,
    # POSIX 走 dir_fd + fstatat + unlinkat。tools job 只跑 windows-latest,
    # POSIX 分支从不被执行——曾因此让 Linux 服主的发布流程整条不可用而无人发现。
    name: Release transaction (POSIX)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mod-tools/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r mod-tools/requirements.txt
      - name: Exercise the POSIX publication transaction
        working-directory: mod-tools
        run: >
          python -m unittest
          tests.test_scoped_release_transaction_identity
          tests.test_scoped_release_safety
          tests.test_scoped_release_ordering
          tests.test_local_cdn_publish
          tests.test_local_scoped_release
          tests.test_local_release_receipt
          tests.test_local_live_release_contract
      - name: Verify the committed local-live release receipt on POSIX
        run: python -X utf8 mod-tools/wf_local_release_verify.py
